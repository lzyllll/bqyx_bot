bot_uin: '123456789'
root: '123456789'
debug: false
adapters:
# - type: ai
#   platform: ai
#   enabled: true
#   config: {}
- type: napcat
  platform: qq
  enabled: true
  config:
    ws_uri: ws://127.0.0.1:3001
    ws_token: your_ws_token
    webui_uri: http://127.0.0.1:6099
    webui_token: your_webui_token
    enable_webui: true
plugin:
  plugins_dir: plugins
  load_plugin: true
  plugin_whitelist: []
  plugin_blacklist: []
logging:
  event_log_levels:
    message: NONE       # 关闭 QQ 对话事件在控制台的日志输出（群聊+私聊）
    meta_event: NONE    # 心跳等元事件日志（保持默认关闭）
